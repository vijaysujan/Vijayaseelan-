<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sujana Binav</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eef2ff, #ffffff);
      color: #1f2937;
      padding: 20px;
    }

    .card {
      max-width: 700px;
      width: 100%;
      background: white;
      padding: 50px 30px;
      text-align: center;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.1);
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      color: #6b7280;
      font-size: 18px;
      line-height: 1.6;
    }

    .buttons {
      margin-top: 30px;
    }

    a {
      display: inline-block;
      padding: 13px 24px;
      margin: 5px;
      border-radius: 30px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .light {
      background: #eef2ff;
      color: #3730a3;
    }

    footer {
      margin-top: 40px;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="avatar">SB</div>

    <h1>Sujana Binav</h1>

    <p>
      Welcome to my personal website.
    </p>

    <div class="buttons">
      <a href="#about">About Me</a>
      <a class="light" href="#contact">Contact</a>
    </div>

    <section id="about" style="margin-top:40px;">
      <h2>About Me</h2>

      <p style="margin-top:10px;">
        Welcome! This website is currently under development.
        More information and projects will be added soon.
      </p>
    </section>

    <section id="contact" style="margin-top:35px;">
      <h2>Contact</h2>

      <p style="margin-top:10px;">
        You can add your email and social-media links here.
      </p>
    </section>

    <footer>
      © 2026 Sujana Binav
    </footer>

  </div>

</body>
</html>
